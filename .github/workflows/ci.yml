name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 前端由 Vercel 的 GitHub 整合自動部署（設定在 vercel.json），這裡只負責測試與觸發後端部署
permissions:
  contents: read

jobs:
  test:
    name: 測試與建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy-backend:
    name: 部署後端（Render）
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 觸發 Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::未設定 RENDER_DEPLOY_HOOK_URL，略過後端部署"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "已觸發 Render 部署" >> "$GITHUB_STEP_SUMMARY"
